<!DOCTYPE html>
<html>
<head>
    <title>CSE Student Form</title>
</head>

<body>

    <h1>CSE Student Details</h1>

    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name">
        <br><br>

        <label>Roll Number:</label>
        <input type="text" placeholder="Enter roll number">
        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="Enter email">
        <br><br>

        <label>Age:</label>
        <input type="number" placeholder="Enter age">
        <br><br>

        <label>Programming Language:</label>
        <select>
            <option>C</option>
            <option>Python</option>
            <option>Java</option>
            <option>C++</option>
        </select>
        <br><br>

        <label>Why do you like CSE?</label>
        <br>
        <textarea rows="4" cols="30" placeholder="Enter your answer"></textarea>
        <br><br>

        <input type="submit" value="Submit">

    </form>

</body>
</html>
